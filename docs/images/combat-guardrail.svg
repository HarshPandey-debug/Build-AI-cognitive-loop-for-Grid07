<svg xmlns="http://www.w3.org/2000/svg" width="950" height="300" viewBox="0 0 950 300">
  <rect width="950" height="300" fill="#111827"/>
  <text x="30" y="45" fill="#f3f4f6" font-family="Arial" font-size="27" font-weight="700">Prompt-Injection Defense Layers</text>

  <rect x="35" y="85" width="270" height="170" rx="12" fill="#1f2937" stroke="#60a5fa"/>
  <text x="55" y="120" fill="#93c5fd" font-family="Arial" font-size="18" font-weight="700">Layer 1: System Prompt</text>
  <text x="55" y="150" fill="#d1d5db" font-family="Arial" font-size="15">Defines persona priority</text>
  <text x="55" y="173" fill="#d1d5db" font-family="Arial" font-size="15">Rejects role changes</text>

  <rect x="340" y="85" width="270" height="170" rx="12" fill="#1f2937" stroke="#34d399"/>
  <text x="360" y="120" fill="#86efac" font-family="Arial" font-size="18" font-weight="700">Layer 2: Detection</text>
  <text x="360" y="150" fill="#d1d5db" font-family="Arial" font-size="15">Regex-based pattern checks</text>
  <text x="360" y="173" fill="#d1d5db" font-family="Arial" font-size="15">Flags prompt injection text</text>

  <rect x="645" y="85" width="270" height="170" rx="12" fill="#1f2937" stroke="#f472b6"/>
  <text x="665" y="120" fill="#f9a8d4" font-family="Arial" font-size="18" font-weight="700">Layer 3: Safe Reply</text>
  <text x="665" y="150" fill="#d1d5db" font-family="Arial" font-size="15">Maintain bot persona</text>
  <text x="665" y="173" fill="#d1d5db" font-family="Arial" font-size="15">Continue factual rebuttal</text>

  <line x1="305" y1="170" x2="340" y2="170" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow3)"/>
  <line x1="610" y1="170" x2="645" y2="170" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrow3)"/>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#9ca3af"/>
    </marker>
  </defs>

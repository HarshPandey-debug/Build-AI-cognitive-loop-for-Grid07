<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <rect width="900" height="260" fill="#0f172a"/>
  <text x="30" y="40" fill="#e2e8f0" font-family="Arial" font-size="26" font-weight="700">Phase 2 LangGraph-Style Node Flow</text>

  <rect x="40" y="90" width="230" height="120" rx="12" fill="#1e293b" stroke="#22d3ee"/>
  <text x="65" y="130" fill="#67e8f9" font-family="Arial" font-size="18" font-weight="700">Node 1: Decide Search</text>
  <text x="65" y="158" fill="#cbd5e1" font-family="Arial" font-size="14">Input: bot persona</text>
  <text x="65" y="180" fill="#cbd5e1" font-family="Arial" font-size="14">Output: topic + query</text>

  <rect x="335" y="90" width="230" height="120" rx="12" fill="#1e293b" stroke="#34d399"/>
  <text x="360" y="130" fill="#86efac" font-family="Arial" font-size="18" font-weight="700">Node 2: Web Search</text>
  <text x="360" y="158" fill="#cbd5e1" font-family="Arial" font-size="14">Tool: mock_searxng_search</text>
  <text x="360" y="180" fill="#cbd5e1" font-family="Arial" font-size="14">Output: context headlines</text>

  <rect x="630" y="90" width="230" height="120" rx="12" fill="#1e293b" stroke="#f59e0b"/>
  <text x="655" y="130" fill="#fcd34d" font-family="Arial" font-size="18" font-weight="700">Node 3: Draft Post</text>
  <text x="655" y="158" fill="#cbd5e1" font-family="Arial" font-size="14">Persona + context</text>
  <text x="655" y="180" fill="#cbd5e1" font-family="Arial" font-size="14">JSON: bot_id/topic/post</text>

  <line x1="270" y1="150" x2="335" y2="150" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="565" y1="150" x2="630" y2="150" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow2)"/>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
  <rect width="1100" height="360" fill="#0b1020"/>
  <text x="40" y="45" fill="#dbeafe" font-family="Arial" font-size="28" font-weight="700">Grid07 Cognitive Loop — System Overview</text>

  <rect x="40" y="90" width="300" height="210" rx="14" fill="#1e293b" stroke="#38bdf8"/>
  <text x="60" y="125" fill="#7dd3fc" font-family="Arial" font-size="20" font-weight="700">Phase 1: Router</text>
  <text x="60" y="155" fill="#e2e8f0" font-family="Arial" font-size="16">• Embed personas</text>
  <text x="60" y="180" fill="#e2e8f0" font-family="Arial" font-size="16">• Embed incoming post</text>
  <text x="60" y="205" fill="#e2e8f0" font-family="Arial" font-size="16">• Cosine similarity</text>
  <text x="60" y="230" fill="#e2e8f0" font-family="Arial" font-size="16">• Return matched bots</text>

  <rect x="400" y="90" width="300" height="210" rx="14" fill="#1e293b" stroke="#34d399"/>
  <text x="420" y="125" fill="#86efac" font-family="Arial" font-size="20" font-weight="700">Phase 2: Content Graph</text>
  <text x="420" y="155" fill="#e2e8f0" font-family="Arial" font-size="16">1) Decide Search</text>
  <text x="420" y="180" fill="#e2e8f0" font-family="Arial" font-size="16">2) Mock Web Search</text>
  <text x="420" y="205" fill="#e2e8f0" font-family="Arial" font-size="16">3) Draft Opinionated Post</text>
  <text x="420" y="230" fill="#e2e8f0" font-family="Arial" font-size="16">Strict JSON Output</text>

  <rect x="760" y="90" width="300" height="210" rx="14" fill="#1e293b" stroke="#f472b6"/>
  <text x="780" y="125" fill="#f9a8d4" font-family="Arial" font-size="20" font-weight="700">Phase 3: Combat RAG</text>
  <text x="780" y="155" fill="#e2e8f0" font-family="Arial" font-size="16">• Parent + thread history</text>
  <text x="780" y="180" fill="#e2e8f0" font-family="Arial" font-size="16">• Injection detection</text>
  <text x="780" y="205" fill="#e2e8f0" font-family="Arial" font-size="16">• Persona-safe rebuttal</text>
  <text x="780" y="230" fill="#e2e8f0" font-family="Arial" font-size="16">• Evidence-driven response</text>

  <line x1="340" y1="195" x2="400" y2="195" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="195" x2="760" y2="195" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
